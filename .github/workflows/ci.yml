name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check application
        run: nix flake check --print-build-logs
      - name: Build Docker image
        run: nix build .#docker

  client-libraries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python SDK
        run: python -m pip install -e ./sdk/python
      - name: Check Python SDK source
        run: python -m compileall -q sdk/python/pacenotes
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust SDK format
        run: cargo fmt --manifest-path sdk/rust/Cargo.toml --check
      - name: Test Rust reqwest backend
        run: cargo test --manifest-path sdk/rust/Cargo.toml --no-default-features --features reqwest
      - name: Test Rust Cyper backend
        run: cargo test --manifest-path sdk/rust/Cargo.toml --no-default-features --features cyper

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: pacenotes
          POSTGRES_USER: pacenotes
          POSTGRES_PASSWORD: pacenotes-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pacenotes -d pacenotes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pacenotes:pacenotes-test@127.0.0.1:5432/pacenotes
      RATE_LIMIT_SALT: browser-test
      GOOGLE_MAPS_API_KEY: test-google-maps-browser-key
      PACENOTES_EXTERNAL_ENABLED: "true"
      GOOGLE_MAP_ID: test-google-map-id
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Install browser
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Build and migrate
        working-directory: app
        run: pnpm build && pnpm db:migrate
      - name: Start application
        working-directory: app
        run: |
          node .output/start.mjs > /tmp/pacenotes-web.log 2>&1 &
      - name: Wait for application
        run: |
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:3000/health/ready
      - name: Run browser checks
        working-directory: app
        run: pnpm test:e2e
      - name: Check mobile performance
        working-directory: app
        run: pnpm test:performance
