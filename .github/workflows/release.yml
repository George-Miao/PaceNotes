name: Publish image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/george-miao/pacenotes

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

  publish:
    name: Build and publish AMD64 image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Build image
        run: nix build .#docker
      - name: Install Skopeo
        run: nix profile install nixpkgs#skopeo
      - name: Select tags
        id: tags
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            primary="$GITHUB_REF_NAME"
            moving="latest"
          else
            primary="main-${GITHUB_SHA:0:7}"
            moving="latest-unstable"
          fi
          echo "primary=$primary" >> "$GITHUB_OUTPUT"
          echo "moving=$moving" >> "$GITHUB_OUTPUT"
      - name: Push image
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIMARY_TAG: ${{ steps.tags.outputs.primary }}
          MOVING_TAG: ${{ steps.tags.outputs.moving }}
        shell: bash
        run: |
          skopeo copy \
            --dest-creds "${GHCR_USER}:${GHCR_TOKEN}" \
            docker-archive:result \
            "docker://${IMAGE_NAME}:${PRIMARY_TAG}"
          skopeo copy \
            --dest-creds "${GHCR_USER}:${GHCR_TOKEN}" \
            docker-archive:result \
            "docker://${IMAGE_NAME}:${MOVING_TAG}"
          skopeo inspect \
            --creds "${GHCR_USER}:${GHCR_TOKEN}" \
            "docker://${IMAGE_NAME}:${PRIMARY_TAG}"

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          image_ref="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          image_url="https://github.com/${GITHUB_REPOSITORY}/pkgs/container/pacenotes"
          printf -v image_note "Container image: [\`%s\`](%s)" "$image_ref" "$image_url"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "$image_note" \
            --title "PaceNotes $GITHUB_REF_NAME"
