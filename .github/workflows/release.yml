name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Verify release tag
        run: |
          printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          git verify-tag "$GITHUB_REF_NAME"
      - name: Build release image
        run: nix build .#docker
      - name: Load release image
        run: docker load < result
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker tag pacenotes:0.1.0 "$IMAGE:$GITHUB_REF_NAME"
          docker tag pacenotes:0.1.0 "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:latest"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
