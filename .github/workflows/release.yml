name: Publish image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/george-miao/pacenotes

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04
    outputs:
      release_commit: ${{ steps.release_commit.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify release commit
        if: github.ref_type == 'branch'
        id: release_commit
        shell: bash
        run: |
          if [[ $(git log -1 --format=%s) =~ ^chore\(release\):\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "$(git log -1 --format=%s)" != "chore(release): $GITHUB_REF_NAME" ]]; then
            echo "release tag must point to its release commit" >&2
            exit 1
          fi

  publish:
    name: Build and publish AMD64 image
    needs: verify
    if: github.ref_type == 'tag' || needs.verify.outputs.release_commit != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Build image
        run: nix build .#docker
      - name: Install Skopeo
        run: nix profile install nixpkgs#skopeo
      - name: Select tags
        id: tags
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            primary="$GITHUB_REF_NAME"
            moving="latest"
          else
            primary="main-${GITHUB_SHA:0:7}"
            moving="latest-unstable"
          fi
          echo "primary=$primary" >> "$GITHUB_OUTPUT"
          echo "moving=$moving" >> "$GITHUB_OUTPUT"
      - name: Push image
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIMARY_TAG: ${{ steps.tags.outputs.primary }}
          MOVING_TAG: ${{ steps.tags.outputs.moving }}
        shell: bash
        run: |
          skopeo copy \
            --dest-creds "${GHCR_USER}:${GHCR_TOKEN}" \
            docker-archive:result \
            "docker://${IMAGE_NAME}:${PRIMARY_TAG}"
          skopeo copy \
            --dest-creds "${GHCR_USER}:${GHCR_TOKEN}" \
            docker-archive:result \
            "docker://${IMAGE_NAME}:${MOVING_TAG}"
          skopeo inspect \
            --creds "${GHCR_USER}:${GHCR_TOKEN}" \
            "docker://${IMAGE_NAME}:${PRIMARY_TAG}"

  mcp-binaries:
    name: Build MCP ${{ matrix.target }}
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
            asset: pacenotes-mcp-linux-x64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: pacenotes-mcp-macos-x64
          - runner: macos-15
            target: bun-darwin-arm64
            asset: pacenotes-mcp-macos-arm64
          - runner: windows-2025
            target: bun-windows-x64
            asset: pacenotes-mcp-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install app dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Build standalone MCP executable
        run: pnpm --dir app build:mcp-cli --target=${{ matrix.target }} --outfile=dist/${{ matrix.asset }}
      - name: Smoke standalone executable
        shell: bash
        run: |
          "app/dist/${{ matrix.asset }}" --version
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: pacenotes-mcp-${{ matrix.target }}
          path: app/dist/pacenotes-mcp-*
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: [publish, mcp-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download MCP executables
        uses: actions/download-artifact@v4
        with:
          pattern: pacenotes-mcp-*
          path: dist
          merge-multiple: true
      - name: Write executable checksums
        shell: bash
        run: |
          cd dist
          sha256sum pacenotes-mcp-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          image_ref="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          image_url="https://github.com/${GITHUB_REPOSITORY}/pkgs/container/pacenotes"
          printf -v image_note "Container image: [\`%s\`](%s)" "$image_ref" "$image_url"
          gh release create "$GITHUB_REF_NAME" dist/pacenotes-mcp-* dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --notes "$image_note" \
            --title "PaceNotes $GITHUB_REF_NAME"
