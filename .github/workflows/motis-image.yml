name: Publish MOTIS image

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      data_rights_confirmed:
        description: Confirm current provider and data publication rights
        required: true
        type: boolean
  release:
    types: [published]

concurrency:
  group: publish-motis-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/george-miao/pacenotes-motis

permissions:
  contents: read

jobs:
  rights:
    name: Check publication rights
    runs-on: ubuntu-24.04
    steps:
      - name: Require an explicit rights confirmation
        env:
          REPOSITORY_CONFIRMATION: ${{ vars.MOTIS_DATA_RIGHTS_CONFIRMED }}
          RUN_CONFIRMATION: ${{ inputs.data_rights_confirmed }}
        shell: bash
        run: |
          if [[ "$REPOSITORY_CONFIRMATION" != "true" && "$RUN_CONFIRMATION" != "true" ]]; then
            echo "MOTIS_DATA_RIGHTS_CONFIRMED must be true before data publication" >&2
            exit 1
          fi

  publish:
    name: Build and publish AMD64 image
    needs: rights
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set image tags
        id: tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          tags="${IMAGE_NAME}:$(date -u +%Y%m%d),${IMAGE_NAME}:latest"
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release tag must have the form vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            tags="${tags},${IMAGE_NAME}:${RELEASE_TAG}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: motis/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
