name: pacenotes

x-app-build: &app-build
  context: ./app

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: pacenotes
      POSTGRES_USER: pacenotes
      POSTGRES_PASSWORD: pacenotes-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacenotes -d pacenotes"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  web:
    image: pacenotes:local
    build: *app-build
    environment:
      DATABASE_URL: postgres://pacenotes:pacenotes-local@db:5432/pacenotes
      RATE_LIMIT_SALT: ${RATE_LIMIT_SALT:-pacenotes-local-only}
      PACENOTES_EXTERNAL_ENABLED: ${PACENOTES_EXTERNAL_ENABLED:-false}
      PACENOTES_EXTERNAL_ALLOWED_ORIGINS: ${PACENOTES_EXTERNAL_ALLOWED_ORIGINS:-}
      PACENOTES_EXTERNAL_CLIENT_RPM: ${PACENOTES_EXTERNAL_CLIENT_RPM:-120}
      PACENOTES_EXTERNAL_TRIP_RPM: ${PACENOTES_EXTERNAL_TRIP_RPM:-240}
      PACENOTES_EXTERNAL_SEARCH_CLIENT_RPM: ${PACENOTES_EXTERNAL_SEARCH_CLIENT_RPM:-30}
      PACENOTES_EXTERNAL_SEARCH_TRIP_RPM: ${PACENOTES_EXTERNAL_SEARCH_TRIP_RPM:-60}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:?GOOGLE_MAPS_API_KEY is required}
      GOOGLE_MAP_ID: ${GOOGLE_MAP_ID:?GOOGLE_MAP_ID is required}
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY:-}
      PORT: 3000
      MOTIS_URL: ${MOTIS_URL:-}
      MOTIS_TIMEOUT_MS: ${MOTIS_TIMEOUT_MS:-5000}
      FRANKFURTER_URL: ${FRANKFURTER_URL:-https://api.frankfurter.dev}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  motis:
    image: ghcr.io/george-miao/pacenotes-motis:latest
    profiles: ["motis"]
    healthcheck:
      test: ["CMD", "/bin/curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres-data:
