[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pacenotes-sdk"
version = "1.0.0"
description = "Source-only async Python SDK for PaceNotes v1"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "websockets>=14,<17"]

[tool.setuptools.packages.find]
include = ["pacenotes*"]

[tool.setuptools.package-data]
pacenotes = ["py.typed"]
