[package]
name = "pacenotes"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Source-only PaceNotes v1 JSON-RPC client"

[features]
default = []
reqwest = ["dep:reqwest", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
cyper = ["dep:cyper", "dep:compio-ws", "dep:compio-net", "dep:compio-driver", "dep:futures-util"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"], optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
tokio = { version = "1", features = ["net"], optional = true }
cyper = { version = "0.9", default-features = false, features = ["stream", "rustls"], optional = true }
compio-ws = { version = "0.4", default-features = false, features = ["connect", "rustls", "ring", "webpki-roots"], optional = true }
compio-net = { version = "0.12", optional = true }
compio-driver = { version = "0.12.5", default-features = false, features = ["polling"], optional = true }
futures-util = { version = "0.3", optional = true }
